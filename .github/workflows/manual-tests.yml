name: Manual Playwright Tests

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated Playwright projects; empty runs all
        type: string
        required: false
        default: ""
      tags:
        description: Playwright grep filter, e.g. @smoke or @smoke|@regression
        type: string
        required: false
        default: ""
      workers:
        description: Workers per runner
        type: number
        required: true
        default: 2
      trace:
        description: Playwright trace mode
        type: choice
        required: true
        options:
          - "on"
          - "off"
          - retain-on-failure
          - on-first-retry
          - retain-on-first-failure
        default: retain-on-failure
      shards:
        description: Number of shards (1-8)
        type: choice
        required: true
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
        default: "1"
      rp-launch-mode:
        description: "Report Portal launch mode"
        type: choice
        required: true
        options:
          - "DEFAULT"
          - "DEBUG"
        default: "DEBUG"

jobs:
  start-rp-launch:
    runs-on: ubuntu-latest
    outputs:
      rp_launch_id: ${{ steps.rp_launch.outputs.rp_launch_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Start launch and set it to output
        id: rp_launch
        uses: actions/github-script@v8
        with:
          script: |
            const startLaunch = require('./rpConfig/startLaunch.js');
            const launchId = await startLaunch();

            core.setOutput('rp_launch_id', launchId);
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
          RP_PROJECT: ${{ secrets.RP_PROJECT }}
          RP_LAUNCH_NAME: "[${{ github.repository }}] Run: ${{ inputs.projects }} ${{ inputs.tags }}"
          RP_MODE: ${{ inputs.rp-launch-mode }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  run-tests:
    needs: [start-rp-launch]
    uses: ./.github/workflows/playwright-sharded.yml
    secrets: inherit
    with:
      branch: ${{ github.ref }}
      projects: ${{ inputs.projects }}
      grep: ${{ inputs.tags }}
      workers: ${{ fromJSON(inputs.workers) }}
      trace: ${{ inputs.trace }}
      shards: ${{ fromJSON(inputs.shards) }}
      launch_id: ${{ needs.start-rp-launch.outputs.rp_launch_id }}

  finish-rp-launch:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [start-rp-launch, run-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Finish RP launch
        uses: actions/github-script@v8
        with:
          script: |
            const finishLaunch = require('./rpConfig/finishLaunch.js');
            await finishLaunch();
        env:
          RP_LAUNCH_ID: ${{ needs.start-rp-launch.outputs.rp_launch_id }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
          RP_PROJECT: ${{ secrets.RP_PROJECT }}