name: Manual Playwright Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test
        type: string
        required: true
        default: main
      projects:
        description: Comma-separated Playwright projects; empty runs all
        type: string
        required: false
        default: ""
      tags:
        description: Playwright grep filter, e.g. @smoke or @smoke|@regression
        type: string
        required: false
        default: ""
      trace:
        description: Playwright trace mode
        type: choice
        required: true
        options:
          - "on"
          - "off"
          - retain-on-failure
          - on-first-retry
          - retain-on-first-failure
        default: retain-on-failure
      shards:
        description: Number of shards (1-4)
        type: choice
        required: true
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
      workers:
        description: Workers per runner (1-4)
        type: choice
        required: true
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "2"
jobs:
  run-tests:
    uses: ./.github/workflows/playwright-sharded.yml
    with:
      branch: ${{ inputs.branch }}
      projects: ${{ inputs.projects }}
      grep: ${{ inputs.tags }}
      workers: ${{ fromJSON(inputs.workers) }}
      trace: ${{ inputs.trace }}
      shards: ${{ fromJSON(inputs.shards) }}