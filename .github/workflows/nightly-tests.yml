name: Nightly Playwright Tests
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test
        type: string
        required: true
        default: main
jobs:
  start-rp-launch:
    runs-on: ubuntu-latest
    outputs:
      rp_launch_id: ${{ steps.rp_launch.outputs.rp_launch_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Start launch and set it to output
        id: rp_launch
        uses: actions/github-script@v8
        with:
          script: |
            const startLaunch = require('./rpConfig/startLaunch.js');
            const launchId = await startLaunch();

            core.setOutput('rp_launch_id', launchId);
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
          RP_PROJECT: ${{ secrets.RP_PROJECT }}
          RP_LAUNCH_NAME: "[${{ github.repository }}] Nightly run"
          RP_MODE: DEFAULT
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  run-tests:
    needs: [start-rp-launch]
    uses: ./.github/workflows/playwright-sharded.yml
    with:
      branch: ${{ inputs.branch || 'main' }}
      projects: ""
      grep: ""
      workers: 2
      trace: retain-on-failure
      shards: 4
      launch_id: ${{ needs.start-rp-launch.outputs.rp_launch_id }}

  finish-rp-launch:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [start-rp-launch, run-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Finish RP launch
        uses: actions/github-script@v8
        with:
          script: |
            const finishLaunch = require('./rpConfig/finishLaunch.js');
            await finishLaunch();
        env:
          RP_LAUNCH_ID: ${{ needs.start-rp-launch.outputs.rp_launch_id }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
          RP_PROJECT: ${{ secrets.RP_PROJECT }}